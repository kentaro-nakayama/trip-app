<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行アプリ - 方位磁針ローダー Playground (正円修正版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>

    /* コンパス針の回転アニメーション */
    @keyframes spinNeedle {
      0% { transform: rotate(0deg); }
      70% { transform: rotate(760deg); }
      85% { transform: rotate(710deg); }
      100% { transform: rotate(720deg); }
    }
    .compass-needle {
      animation: spinNeedle 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: center center;
    }

    /* 輪郭の脈動（不透明度のみ変化させて正円を維持） */
    @keyframes pulseOpacity {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    .pulse-ring-stroke {
      animation: pulseOpacity 2s ease-in-out infinite;
    }

    /* スケルトンシマー（波打ち）アニメーション */
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .shimmer-effect {
      position: relative;
      overflow: hidden;
    }
    .shimmer-effect::after {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 255, 255, 0.5) 20%,
        rgba(255, 255, 255, 0.8) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shimmer 1.8s infinite;
      content: '';
    }
  </style>
</head>
<body class="travel-bg min-h-screen text-slate-800 antialiased selection:bg-indigo-100">

  <!-- ヘッダーコントロール -->
  <header class="border-b border-slate-200/60 bg-white/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-xl">🧭</span>
        <h1 class="font-bold text-slate-800 text-lg">旅行アプリ - 方位磁針ローダー Playground</h1>
      </div>
      <button id="toggleLoadingBtn" class="flex items-center gap-2 px-4 py-2 text-xs font-semibold text-indigo-600 bg-indigo-50 border border-indigo-200/60 rounded-full hover:bg-indigo-100 transition-all shadow-sm active:scale-95">
        <span id="btnIcon">🔄</span>
        <span id="btnText">ローディングを完了する</span>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">
    
    <!-- タイトルエリア -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h2 class="text-2xl font-bold text-slate-900 tracking-tight">旅行一覧</h2>
        <p class="text-sm text-slate-400 mt-1">2件の旅行</p>
      </div>

      <div class="flex items-center gap-3">
        <!-- 主ボタン (rgb(78, 71, 221)) -->
        <button id="createTripBtn" style="background-color: rgb(78, 71, 221);" class="relative px-5 py-2.5 text-white text-xs font-medium rounded-full shadow-md hover:shadow-indigo-300/50 hover:opacity-95 transition-all duration-200 active:scale-95 flex items-center gap-2">
          <span>新しい旅行を作成</span>
        </button>
        <div class="w-9 h-9 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-sm shadow-sm">
          👤
        </div>
      </div>
    </div>

    <!-- ローディング状態 (正円修正済み 方位磁針ローダー) -->
    <div id="loadingView" class="space-y-6">
      
      <div class="bg-white/90 backdrop-blur border border-slate-200/80 rounded-2xl p-8 text-center shadow-sm flex flex-col items-center justify-center min-h-[220px]">
        
        <!-- コンパス全体のコンテナ（80px × 80px 正方形に固定） -->
        <div class="relative w-20 h-20 aspect-square flex items-center justify-center mb-3">
          
          <!-- 外枠リング＆目盛り（1:1で正円を描画） -->
          <svg class="absolute inset-0 w-full h-full" viewBox="0 0 80 80" width="80" height="80">
            <!-- 1. 外側の青い外輪郭 (正円: cx=40, cy=40, r=36) -->
            <circle class="pulse-ring-stroke" cx="40" cy="40" r="36" fill="none" stroke="rgb(78, 71, 221)" stroke-width="2" />
            
            <!-- 2. 内側のグレーの枠線 (正円: cx=40, cy=40, r=29) -->
            <circle cx="40" cy="40" r="29" fill="none" stroke="#cbd5e1" stroke-width="2" />
            
            <!-- 3. 東西南北の目盛り線 -->
            <line x1="40" y1="13" x2="40" y2="17" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
            <line x1="40" y1="63" x2="40" y2="67" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
            <line x1="13" y1="40" x2="17" y2="40" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
            <line x1="63" y1="40" x2="67" y2="40" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
            
            <!-- 4. N マーク (北) -->
            <text x="40" y="25" font-size="7.5" font-weight="800" fill="rgb(78, 71, 221)" text-anchor="middle" dominant-baseline="middle">N</text>
          </svg>

          <!-- 回転するコンパス針 -->
          <div class="compass-needle absolute inset-0 w-full h-full flex items-center justify-center">
            <svg class="w-full h-full" viewBox="0 0 80 80" width="80" height="80">
              <!-- 北針 (ブランドカラー) -->
              <polygon points="40,20 44,40 40,37" fill="rgb(78, 71, 221)" />
              <polygon points="40,20 36,40 40,37" fill="rgb(99, 92, 241)" />
              
              <!-- 南針 (グレー) -->
              <polygon points="40,60 44,40 40,43" fill="#cbd5e1" />
              <polygon points="40,60 36,40 40,43" fill="#94a3b8" />
            </svg>
          </div>

          <!-- 中央ピボット（正円） -->
          <div class="absolute w-3.5 h-3.5 bg-white border-2 border-indigo-600 rounded-full shadow-sm z-10"></div>
        </div>
        
        <p class="text-xs font-medium text-slate-500 tracking-wide mt-1">読み込み中...</p>
      </div>

      <!-- スケルトンカード2枚 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white/70 border border-slate-200/60 rounded-2xl p-6 space-y-4 shimmer-effect">
          <div class="h-5 bg-slate-200/70 rounded-md w-1/3"></div>
          <div class="h-3.5 bg-slate-200/50 rounded-md w-2/3"></div>
          <div class="h-3 bg-slate-200/40 rounded-md w-1/2"></div>
          <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
            <div class="w-7 h-7 bg-slate-200/60 rounded-full"></div>
            <div class="h-3 bg-slate-200/40 rounded-md w-16"></div>
          </div>
        </div>

        <div class="bg-white/70 border border-slate-200/60 rounded-2xl p-6 space-y-4 shimmer-effect">
          <div class="h-5 bg-slate-200/70 rounded-md w-1/4"></div>
          <div class="h-3.5 bg-slate-200/50 rounded-md w-1/2"></div>
          <div class="h-3 bg-slate-200/40 rounded-md w-1/3"></div>
          <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
            <div class="w-7 h-7 bg-slate-200/60 rounded-full"></div>
            <div class="h-3 bg-slate-200/40 rounded-md w-16"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- コンテンツ読み込み完了状態 -->
    <div id="contentView" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
      <!-- 広島旅行 -->
      <div class="bg-white/90 backdrop-blur border border-slate-200/80 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-start mb-2">
            <h3 class="text-base font-bold text-slate-800">広島旅行</h3>
            <div class="flex items-center gap-2 text-slate-400 text-sm">
              <button class="hover:text-slate-600 transition">✏️</button>
              <button class="hover:text-slate-600 transition">🗑️</button>
            </div>
          </div>
          <p class="text-xs text-slate-400 font-mono mb-2">2026-09-13 ～ 2026-09-14</p>
          <p class="text-xs text-slate-600">彼女と一緒に1泊2日で広島旅行</p>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
          <div class="w-6 h-6 rounded-full bg-indigo-500 text-white flex items-center justify-center text-xs">👤</div>
          <span>1人が参加</span>
        </div>
      </div>

      <!-- 台湾旅行 -->
      <div class="bg-white/90 backdrop-blur border border-slate-200/80 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-start mb-2">
            <h3 class="text-base font-bold text-slate-800">台湾旅行</h3>
            <div class="flex items-center gap-2 text-slate-400 text-sm">
              <button class="hover:text-slate-600 transition">✏️</button>
              <button class="hover:text-slate-600 transition">🗑️</button>
            </div>
          </div>
          <p class="text-xs text-slate-400 font-mono mb-2">2026-10-01 ～ 2026-10-04</p>
          <p class="text-xs text-slate-600">美味しい小籠包と夜市を満喫する旅</p>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
          <div class="w-6 h-6 rounded-full bg-indigo-500 text-white flex items-center justify-center text-xs">👤</div>
          <span>1人が参加</span>
        </div>
      </div>
    </div>

  </main>

  <script>
    let isLoading = true;
    const loadingView = document.getElementById('loadingView');
    const contentView = document.getElementById('contentView');
    const toggleBtn = document.getElementById('toggleLoadingBtn');
    const btnText = document.getElementById('btnText');
    const createTripBtn = document.getElementById('createTripBtn');

    toggleBtn.addEventListener('click', () => {
      isLoading = !isLoading;
      if (isLoading) {
        loadingView.classList.remove('hidden');
        contentView.classList.add('hidden');
        btnText.textContent = 'ローディングを完了する';
      } else {
        loadingView.classList.add('hidden');
        contentView.classList.remove('hidden');
        btnText.textContent = 'ローディング状態に戻す';
      }
    });

    createTripBtn.addEventListener('click', (e) => {
      const rect = createTripBtn.getBoundingClientRect();
      const x = (rect.left + rect.width / 2) / window.innerWidth;
      const y = (rect.top + rect.height / 2) / window.innerHeight;

      confetti({
        particleCount: 24,
        spread: 100,
        startVelocity: 12,
        ticks: 180,
        origin: { x, y },
        colors: ['#4E47DD', '#6366F1', '#38BDF8', '#F43F5E'],
        scalar: 1.1
      });
    });
  </script>
</body>
</html>
